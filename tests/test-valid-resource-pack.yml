name: Test with valid Minecraft Bedrock resource pack
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid resource pack structure
        run: |
          mkdir -p /tmp/mc-rp/resource_pack/textures
          cat > /tmp/mc-rp/resource_pack/manifest.json << 'EOF'
          {
            "format_version": 2,
            "header": {
              "description": "Test Resource Pack",
              "name": "Test RP",
              "uuid": "abcdef12-abcd-abcd-abcd-abcdef123456",
              "version": [1, 0, 0],
              "min_engine_version": [1, 16, 0]
            },
            "modules": [
              {
                "description": "Test Resource Pack Module",
                "type": "resources",
                "uuid": "abcdef12-abcd-abcd-abcd-abcdef123457",
                "version": [1, 0, 0]
              }
            ]
          }
          EOF

      - name: Run action against resource pack folder
        id: action
        uses: .
        with:
          folder: /tmp/mc-rp

      - name: Assert action completed
        run: |
          echo "Action completed successfully with valid resource pack"
          echo "PASS"
