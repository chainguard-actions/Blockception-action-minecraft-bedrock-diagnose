name: 📑 Release Page

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tagged-release:
    name: 📑 Release Page
    runs-on: "ubuntu-latest"

    steps:
      - name: 📑 Release Page
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          generateReleaseNotes: true
          makeLatest: true
