name: Test valid Minecraft Bedrock resource pack
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid Minecraft Bedrock resource pack
        run: |
          mkdir -p /tmp/mc-rp-test/resource_pack
          # Write a valid resource pack manifest
          cat > /tmp/mc-rp-test/resource_pack/manifest.json << 'EOF'
          {
            "format_version": 2,
            "header": {
              "name": "Test Resource Pack",
              "description": "A test resource pack",
              "uuid": "abcdef12-abcd-abcd-abcd-abcdef123456",
              "version": [1, 0, 0],
              "min_engine_version": [1, 16, 0]
            },
            "modules": [
              {
                "type": "resources",
                "uuid": "abcdef12-abcd-abcd-abcd-abcdef123457",
                "version": [1, 0, 0]
              }
            ]
          }
          EOF

      - name: Run action on valid resource pack folder
        id: action
        uses: .
        with:
          folder: /tmp/mc-rp-test

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully on valid resource pack"
          echo "PASS"
