name: Test basic usage with empty folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty test folder
        run: mkdir -p /tmp/mc-empty

      - name: Ensure GITHUB_STEP_SUMMARY is set
        run: |
          if [ -z "$GITHUB_STEP_SUMMARY" ]; then
            echo "GITHUB_STEP_SUMMARY=/tmp/step-summary.md" >> "$GITHUB_ENV"
            touch /tmp/step-summary.md
          fi

      - id: action
        name: Run diagnose on empty folder
        uses: .
        with:
          folder: /tmp/mc-empty

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with no packs found"
          echo "PASS"
