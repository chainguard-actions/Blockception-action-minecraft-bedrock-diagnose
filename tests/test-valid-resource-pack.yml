name: Test valid resource pack
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure GITHUB_STEP_SUMMARY is set
        run: |
          if [ -z "$GITHUB_STEP_SUMMARY" ]; then
            echo "GITHUB_STEP_SUMMARY=/tmp/step-summary.md" >> "$GITHUB_ENV"
            touch /tmp/step-summary.md
          fi

      - id: action
        name: Run diagnose on valid resource pack fixture
        uses: .
        with:
          folder: ${{ github.workspace }}/tests/fixtures/resource-pack-project

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully with valid resource pack"
          echo "PASS"
