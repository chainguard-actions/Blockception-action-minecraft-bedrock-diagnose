name: Test basic usage with empty folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty test folder
        run: mkdir -p /tmp/mc-empty

      - name: Run action against empty folder
        id: action
        uses: .
        with:
          folder: /tmp/mc-empty

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with no Minecraft packs found"
          echo "PASS"
