name: Test basic usage - default folder
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default folder
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should complete (either success or failure is acceptable
          # when no Minecraft content is present — it should not crash/error out)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran to completion"
