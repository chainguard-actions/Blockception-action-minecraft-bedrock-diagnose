name: Test basic usage - default folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default folder
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action completed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should succeed (no Minecraft manifests found = no errors)
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed with no Minecraft project present"
            exit 1
          fi
          echo "PASS"
