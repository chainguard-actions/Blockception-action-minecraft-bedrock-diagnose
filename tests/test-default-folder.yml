name: Test default folder (github.workspace)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default folder (no explicit folder input)
        id: action
        uses: .

      - name: Assert action completed successfully
        run: |
          echo "Action completed with default folder (workspace)"
          echo "PASS"
